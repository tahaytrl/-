name: Build Android APK
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:
 
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Generate Flutter project and package Python app
        run: flet build apk -v
 
      - name: Patch notifications plugin (receivers, desugaring)
        run: flet-android-notifications-patch --project-root build/flutter
 
      - name: Build patched release APK
        run: |
          FLUTTER_BIN=$(find "$HOME/flutter" -maxdepth 3 -type f -name flutter -path "*/bin/*" 2>/dev/null | head -n 1)
          if [ -z "$FLUTTER_BIN" ]; then FLUTTER_BIN=$(command -v flutter); fi
          echo "Using Flutter: $FLUTTER_BIN"
          cd build/flutter
          "$FLUTTER_BIN" build apk --release
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: birthday-reminder-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
